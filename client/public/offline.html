<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07111d" />
    <title>Naval Combat · Connect to play</title>
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #07111d; color: #e8f2f4; font-family: system-ui, sans-serif; text-align: center; }
      main { max-width: 340px; }
      h1 { font-size: 24px; }
      p { color: #b6ced7; line-height: 1.6; }
      a { display: inline-block; margin-top: 12px; padding: 12px 22px; border-radius: 6px; background: #65dae0; color: #07111d; text-decoration: none; font-weight: 600; }
      a:focus-visible { outline: 2px solid #65dae0; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Connect to play</h1>
      <p>Naval Combat needs an internet connection to load the sea trial. Reconnect, then try again.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
